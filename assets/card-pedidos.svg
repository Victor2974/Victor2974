<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Gestão de Pedidos">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#f59e0b"/><stop offset=".5" stop-color="#1e293b"/><stop offset="1" stop-color="#a78bfa"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1280 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow" cx="0" cy="0" r="1"><stop offset="0" stop-color="#f59e0b" stop-opacity=".28"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
  <clipPath id="cl"><rect width="640" height="300" rx="20"/></clipPath>
</defs>
<g clip-path="url(#cl)">
  <rect width="640" height="300" fill="#0b1020"/>
  <circle cx="60" cy="40" r="300" fill="url(#glow)"/>
  <rect x="-260" y="0" width="220" height="300" fill="url(#sweep)" transform="skewX(-20)">
    <animate attributeName="x" values="-260;900;900" keyTimes="0;.45;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="32" y="30" width="64" height="64" rx="16" fill="url(#g)"/>
  <text x="64" y="74" text-anchor="middle" font-size="32">📦</text>
  <text x="114" y="72" font-family="'Segoe UI', Inter, Ubuntu, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Gestão de Pedidos</text>
  <rect x="466" y="40" width="142" height="28" rx="14" fill="#facc15" fill-opacity=".15"/>
  <circle cx="482" cy="54" r="4" fill="#facc15"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="543" y="59" text-anchor="middle" font-family="'Segoe UI', Inter, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#facc15">Em construção</text>
  <text x="32" y="148" font-family="'Segoe UI', Inter, Ubuntu, Helvetica, Arial, sans-serif" font-size="21" fill="#94a3b8">API nascida de um fluxo real de produção:</text><text x="32" y="177" font-family="'Segoe UI', Inter, Ubuntu, Helvetica, Arial, sans-serif" font-size="21" fill="#94a3b8">do lançamento do pedido ao setor de corte</text><text x="32" y="206" font-family="'Segoe UI', Inter, Ubuntu, Helvetica, Arial, sans-serif" font-size="21" fill="#94a3b8">de uma confecção.</text>
  <rect x="32" y="236" width="65" height="34" rx="17" fill="#f89820" fill-opacity=".12" stroke="#f89820" stroke-opacity=".55"/><text x="65" y="258" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="15" fill="#f89820">Java</text><rect x="107" y="236" width="127" height="34" rx="17" fill="#6db33f" fill-opacity=".12" stroke="#6db33f" stroke-opacity=".55"/><text x="171" y="258" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="15" fill="#6db33f">Spring Boot</text><rect x="244" y="236" width="118" height="34" rx="17" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-opacity=".55"/><text x="303" y="258" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, Menlo, monospace" font-size="15" fill="#60a5fa">PostgreSQL</text>
  <rect x="1" y="1" width="638" height="298" rx="19" fill="none" stroke="url(#bd)" stroke-width="2"/>
</g>
</svg>